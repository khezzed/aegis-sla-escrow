[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "aegis-sla-escrow"
version = "0.1.0"
description = "AEGIS: Autonomous Cloud SLA & API Uptime Performance Escrow Intelligent Contract on GenLayer"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "genvm-linter",
    "genlayer-test",
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests/direct"]
pythonpath = [".", "contracts"]
addopts = "-v"
